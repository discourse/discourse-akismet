  system_messages:
    akismet_spam:
      subject_template: "آکِزمت نے عارضی طور پر آپ کی پوسٹ چھپا دی ہے"
      text_body_template: |
        آداب،

        ہمارے خودکار اسپیم فلٹر، [Akismet](https://akismet.com/) نے عارضی طور پر [آپ کے دھاگے](%{post_link}) کو *%{topic_title}* میں جانچ کے لیے چھپا دیا ہے۔

        ایک [عملہ کے رکن](%{base_url}/about) جلد ہی آپ کے دھاگے کا جائزہ لیں گے اور یہ جلد ہی ظاہر ہو جائے گا۔

        ہم اس تکلیف کے لیے معذرت خواہ ہیں۔
    akismet_not_spam:
      subject_template: "آپ کا دھاگہ اب پوشیدہ نہیں۔"
      text_body_template: |
        آداب،

        ایک [عملے کے رکن](%{base_url}/about) نے *%{topic_title}* میں [آپ کے دھاگے](%{post_link}) کا جائزہ لیا اور اب یہ پوشیدہ نہیں ہے۔
